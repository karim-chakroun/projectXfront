<h2 mat-dialog-title class="dialog-title">
    <mat-icon>directions_car</mat-icon>
    Add New Car
</h2>

<mat-dialog-content class="dialog-content" [formGroup]="form">



    <!-- FORM CARD -->
    <mat-card class="form-card">
        <mat-card-content>
            
            <div class="form-grid">

                <mat-form-field appearance="outline">
                    <mat-label>Brand</mat-label>
                    <input matInput formControlName="brand">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Model</mat-label>
                    <input matInput formControlName="model">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Year</mat-label>
                    <input matInput type="number" formControlName="year">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Price (TND)</mat-label>
                    <input matInput type="number" formControlName="price">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Monthly Payment</mat-label>
                    <input matInput type="number" formControlName="monthlyPayment">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Fuel Type</mat-label>
                    <input matInput formControlName="fuelType">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Gearbox</mat-label>
                    <input matInput formControlName="gearbox">
                </mat-form-field>

            </div>
<app-upload (onUploadFinished)="onImageUploaded($event)">
            </app-upload>
        </mat-card-content>
    </mat-card>

</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="!form.valid || !imageUrl">
        Save Car
    </button>
</mat-dialog-actions>
