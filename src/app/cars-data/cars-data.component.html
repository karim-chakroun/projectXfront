<button mat-raised-button color="primary" (click)="openAddCarDialog()">
  + Add Car
</button>
<br>
<div class="mat-elevation-z4">

  <table mat-table [dataSource]="dataSource" class="full-width-table">

    <!-- Brand -->
    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef> Brand </th>
      <td mat-cell *matCellDef="let car"> {{ car.brand }} </td>
    </ng-container>

    <!-- Model -->
    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef> Model </th>
      <td mat-cell *matCellDef="let car"> {{ car.model }} </td>
    </ng-container>

    <!-- Year -->
    <ng-container matColumnDef="year">
      <th mat-header-cell *matHeaderCellDef> Year </th>
      <td mat-cell *matCellDef="let car"> {{ car.year }} </td>
    </ng-container>

    <!-- Price -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Price (TND) </th>
      <td mat-cell *matCellDef="let car">
        {{ car.price | number:'1.0-0' }}
      </td>
    </ng-container>

    <!-- Monthly -->
    <ng-container matColumnDef="monthlyPayment">
      <th mat-header-cell *matHeaderCellDef> Monthly </th>
      <td mat-cell *matCellDef="let car">
        {{ car.monthlyPayment | number:'1.0-0' }}
      </td>
    </ng-container>

    <!-- Availability -->
    <ng-container matColumnDef="availability">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let car">
        <span
          class="status"
          [ngClass]="car.isAvailable ? 'available' : 'not-available'">
          {{ car.isAvailable ? 'Disponible' : 'Non disponible' }}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
  </mat-paginator>

</div>
